name: Build API

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - '.github/workflows/build-api.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'api/**'
      - '.github/workflows/build-api.yml'

concurrency:
  group: api-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: read

defaults:
  run:
    working-directory: api
    shell: pwsh

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Setup GitHub repository
        uses: actions/checkout@v7

      - name: Install tools dependencies
        run: dotnet tool restore

      - name: Install dependencies
        run: dotnet restore

      - name: Begin SonarCloud analysis
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin /k:"jbvigneron_bang" /o:"jbvigneron" /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml

      - name: Build
        run: dotnet build --no-restore --configuration Release
        
      - name: Run tests and collect code coverage
        run: |
          $bytes = New-Object byte[] 64
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          try {
            $rng.GetBytes($bytes)
            $env:Jwt__Key = [Convert]::ToBase64String($bytes)
            dotnet coverage collect 'dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=Bang.Tests.trx"' -f xml -o "coverage.xml"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $rng.Dispose()
            [Array]::Clear($bytes, 0, $bytes.Length)
            Remove-Item Env:Jwt__Key -ErrorAction SilentlyContinue
          }

      - name: Publish tests results
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: dorny/test-reporter@v3
        with:
          name: Tests Results
          path: 'api/Bang.Tests/TestResults/*.trx'
          reporter: dotnet-trx

      - name: Generate Live Documentation
        run: |
            dotnet livingdoc test-assembly Bang.Tests/bin/Release/net8.0/Bang.Tests.dll -o LivingDoc.html -t Bang.Tests/bin/Release/net8.0/TestExecution.json

      - name: Publish Live Documentation
        uses: actions/upload-artifact@v7
        with:
          name: "Live Documentation"
          path: api/LivingDoc.html

      - name: End SonarCloud analysis
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"